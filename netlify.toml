[build]
  command = "npm run build"
  publish = "dist"

# The API is served by the Netlify Server (netlify/server/index.ts) on /api/*.
# Every other app route falls back to the single-page app.
[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/divisions/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/divisions"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/roster"
  to = "/portal/roster"
  status = 301

[[redirects]]
  from = "/leadership"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/news/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/news"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/documents"
  to = "/portal/documents"
  status = 301

[[redirects]]
  from = "/login"
  to = "/admin/login"
  status = 301

[[redirects]]
  from = "/complaint"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/complaint/status"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/community"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/policies/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/training"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/training/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/reports"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/reports/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex"
